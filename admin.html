<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Administrar catálogo · Domótica y Seguridad</title>
<style>
  :root{ --ink:#12161C; --paper:#F6F4EF; --card:#FFFFFF; --line:#DCD6C7; --text:#1C2027; --soft:#5B6472; --amber:#E8A33D; --green:#2FA97D; --red:#B2493F; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif; background:var(--paper); color:var(--text); font-size:14px; }
  [hidden]{ display:none !important; }
  header{ background:var(--ink); color:#EDEBE4; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header b{ font-size:15px; }
  header .r{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header a{ color:#B9C0CB; font-size:13px; }
  .wrap{ max-width:980px; margin:0 auto; padding:20px; }
  h2{ font-size:15px; margin:26px 0 10px; display:flex; align-items:center; gap:8px; }
  h2 small{ background:var(--line); border-radius:10px; padding:1px 8px; font-size:11px; font-weight:600; color:var(--soft); }
  input,select{ font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--text); min-width:0; }
  input:focus,select:focus{ outline:2px solid var(--amber); outline-offset:-1px; }
  .btn{ font:inherit; font-weight:600; padding:8px 14px; border-radius:7px; border:1px solid transparent; background:var(--amber); color:#1A1305; cursor:pointer; white-space:nowrap; display:inline-block; text-align:center; }
  .btn.ghost{ background:#fff; border-color:var(--line); color:var(--text); }
  .btn.danger{ background:#fff; border-color:#E3B9B4; color:var(--red); }
  .btn.green{ background:var(--green); color:#08241A; }
  .btn:disabled{ opacity:.5; cursor:wait; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  /* login */
  #login{ max-width:360px; margin:12vh auto 0; }
  #login h1{ font-size:18px; margin:0 0 4px; }
  #login p{ color:var(--soft); margin:0 0 14px; }
  #login form{ display:flex; flex-direction:column; gap:10px; }
  /* alta */
  #addForm{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end; }
  #addForm label{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--soft); }
  #addForm .wide{ grid-column:1 / -1; }
  /* filas */
  .row{ display:flex; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; align-items:flex-start; }
  .row.hidden-p{ background:#FAF3E3; border-style:dashed; }
  .thumb{ width:84px; height:84px; flex-shrink:0; border-radius:8px; background:#EFEBE0; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:11px; color:var(--soft); }
  .thumb img{ max-width:100%; max-height:100%; object-fit:contain; }
  .fields{ flex:1; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .fields input.f-nombre{ font-weight:600; }
  .line{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .line label{ display:flex; align-items:center; gap:4px; }
  .f-precio{ width:96px; }
  .chk{ font-size:13px; }
  .badge{ font-size:11px; background:#F0C078; color:#5A3A00; border-radius:5px; padding:1px 7px; font-weight:600; }
  .acts{ display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  @media(max-width:640px){ .row{ flex-wrap:wrap; } .acts{ flex-direction:row; flex-wrap:wrap; width:100%; } }
  .toast{ position:fixed; left:50%; bottom:20px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; opacity:0; pointer-events:none; transition:.25s; max-width:90vw; z-index:20; font-size:13px; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  .toast.err{ background:var(--red); }
  .empty{ color:var(--soft); }
</style>
</head>
<body>

<div id="login" class="panel" hidden>
  <h1>Administrar catálogo</h1>
  <p>Entra con tu correo de administrador.</p>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Correo" autocomplete="username" required />
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" required />
    <button class="btn" type="submit" id="loginBtn">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <b>Catálogo · <span id="count">…</span></b>
    <div class="r">
      <a href="index.html" target="_blank" rel="noopener">Ver página pública ↗</a>
      <button class="btn ghost" id="logout">Salir</button>
    </div>
  </header>
  <div class="wrap">

    <div class="panel" id="importBox" hidden>
      <b>El catálogo está vacío.</b>
      <p style="margin:6px 0 12px;color:var(--soft)">Puedes cargar de una vez los productos iniciales (con fotos y precios). Las tarjetas de muestra entran <b>ocultas</b>: revísalas, corrígelas o bórralas.</p>
      <button class="btn green" id="importBtn">Importar catálogo inicial</button>
      <span id="importMsg" style="margin-left:10px;color:var(--soft)"></span>
    </div>

    <h2>Agregar producto</h2>
    <form id="addForm" class="panel">
      <label>Categoría<select id="a-cat"></select></label>
      <label>Precio ($)<input id="a-precio" type="number" step="0.01" min="0" required /></label>
      <label class="wide">Nombre<input id="a-nombre" required placeholder="Ej. Cámara EZVIZ H3C 2K" /></label>
      <label class="wide">Descripción corta<input id="a-desc" placeholder="Ej. Exterior · WiFi · por unidad" /></label>
      <label>Foto<input id="a-foto" type="file" accept="image/*" /></label>
      <button class="btn" type="submit" id="a-btn">Agregar</button>
    </form>

    <div id="list"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = "https://fbbwovddsuhazsgxpyma.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiYndvdmRkc3VoYXpzZ3hweW1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDUzMjUsImV4cCI6MjEwMzI4MTMyNX0.iIQox0aUa0rQ3_nxUftKHWgLqYyPgjcTP-liT8AwoDA";
const SK = "ds_admin_session";
const CATS = [["camaras","Cámaras"],["alarmas","Alarmas"],["cercos","Cercos eléctricos"],["domotica","Domótica"],["acceso","Control de acceso"],["accesorios","Accesorios"]];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let session = null, rows = [], pending = {};
try { session = JSON.parse(localStorage.getItem(SK) || "null"); } catch(e) {}

function say(msg, err){
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(say.t); say.t = setTimeout(() => t.className = "toast", 4500);
}

/* ---------- sesión ---------- */
function keepSession(j){
  session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now()/1000) + (j.expires_in || 3600) };
  localStorage.setItem(SK, JSON.stringify(session));
}
async function authCall(grant, body){
  const r = await fetch(API + "/auth/v1/token?grant_type=" + grant, { method:"POST", headers:{ apikey:KEY, "Content-Type":"application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if(!r.ok) throw new Error(j.error_description || j.msg || "No se pudo iniciar sesión");
  keepSession(j);
}
async function token(){
  if(!session) throw new Error("Sin sesión");
  if(session.expires_at - 60 < Date.now()/1000) await authCall("refresh_token", { refresh_token: session.refresh_token });
  return session.access_token;
}
async function api(path, opts = {}){
  const t = await token();
  const r = await fetch(API + "/rest/v1/" + path, { ...opts, headers: { apikey:KEY, Authorization:"Bearer " + t, "Content-Type":"application/json", ...(opts.headers || {}) } });
  const txt = await r.text();
  if(!r.ok) throw new Error(txt || ("Error " + r.status));
  return txt ? JSON.parse(txt) : null;
}
function showLogin(){ $("app").hidden = true; $("login").hidden = false; }
function logout(){ localStorage.removeItem(SK); session = null; showLogin(); }

/* ---------- fotos: se reducen aquí mismo antes de guardarse ---------- */
function resizeImage(file, max = 480){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        const x = c.getContext("2d");
        x.drawImage(im, 0, 0, c.width, c.height);
        let d = c.toDataURL("image/webp", 0.82);
        if(!d.startsWith("data:image/webp")){            // navegadores sin WebP
          x.globalCompositeOperation = "destination-over"; x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
          d = c.toDataURL("image/jpeg", 0.85);
        }
        res(d);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- pantalla ---------- */
function rowHtml(p){
  return `<div class="row${p.visible ? "" : " hidden-p"}" data-id="${p.id}">
    <div class="thumb">${p.imagen ? `<img src="${esc(p.imagen)}" alt="">` : "Sin foto"}</div>
    <div class="fields">
      <input class="f-nombre" value="${esc(p.nombre)}" placeholder="Nombre" />
      <input class="f-desc" value="${esc(p.descripcion || "")}" placeholder="Descripción corta" />
      <div class="line">
        <label>$<input class="f-precio" type="number" step="0.01" min="0" value="${p.precio}" /></label>
        <select class="f-cat">${CATS.map(([i, l]) => `<option value="${i}"${i === p.categoria ? " selected" : ""}>${l}</option>`).join("")}</select>
        <label class="chk"><input class="f-vis" type="checkbox"${p.visible ? " checked" : ""} /> Visible en la web</label>
        ${p.visible ? "" : '<span class="badge">OCULTO</span>'}
      </div>
    </div>
    <div class="acts">
      <label class="btn ghost">Cambiar foto<input type="file" accept="image/*" class="f-file" hidden /></label>
      <button class="btn" data-act="save">Guardar</button>
      <button class="btn danger" data-act="del">Eliminar</button>
    </div>
  </div>`;
}
function render(){
  $("count").textContent = rows.length + " producto" + (rows.length === 1 ? "" : "s");
  $("importBox").hidden = rows.length > 0;
  $("list").innerHTML = CATS.map(([id, label]) => {
    const items = rows.filter(p => p.categoria === id);
    return items.length ? `<h2>${label} <small>${items.length}</small></h2>` + items.map(rowHtml).join("") : "";
  }).join("") || '<p class="empty">Aún no hay productos.</p>';
}
async function load(){
  rows = await api("productos?select=*&order=categoria.asc,orden.asc,created_at.asc");
  render();
}
async function start(){
  $("login").hidden = true; $("app").hidden = false;
  $("a-cat").innerHTML = CATS.map(([i, l]) => `<option value="${i}">${l}</option>`).join("");
  try { await load(); }
  catch(e){ say("No se pudo cargar: " + e.message, 1); if(/JWT|401|expired/i.test(e.message)) logout(); }
}

/* ---------- acciones ---------- */
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault(); const b = $("loginBtn"); b.disabled = true;
  try { await authCall("password", { email: $("email").value.trim(), password: $("pass").value }); await start(); }
  catch(err){ say(err.message, 1); }
  b.disabled = false;
});
$("logout").onclick = logout;

$("list").addEventListener("click", async e => {
  const btn = e.target.closest("button[data-act]"); if(!btn) return;
  const row = btn.closest(".row"), id = row.dataset.id;
  btn.disabled = true;
  try {
    if(btn.dataset.act === "save"){
      const body = {
        nombre: row.querySelector(".f-nombre").value.trim(),
        descripcion: row.querySelector(".f-desc").value.trim(),
        precio: Number(row.querySelector(".f-precio").value),
        categoria: row.querySelector(".f-cat").value,
        visible: row.querySelector(".f-vis").checked,
      };
      if(!body.nombre || !(body.precio >= 0)) throw new Error("Falta el nombre o el precio no es válido.");
      if(pending[id]) body.imagen = pending[id];
      const res = await api("productos?id=eq." + id, { method:"PATCH", headers:{ Prefer:"return=representation" }, body: JSON.stringify(body) });
      if(!res || !res.length) throw new Error("No se guardó: tu usuario no es el administrador. Revisa el correo escrito en el SQL.");
      Object.assign(rows.find(p => p.id === id), res[0]); delete pending[id];
      render(); say("Guardado ✔");
    } else if(btn.dataset.act === "del"){
      if(!confirm("¿Eliminar \"" + row.querySelector(".f-nombre").value + "\"? Esto no se puede deshacer.\n\nSi solo quieres quitarlo de la web, mejor desmarca “Visible”.")) { btn.disabled = false; return; }
      const res = await api("productos?id=eq." + id, { method:"DELETE", headers:{ Prefer:"return=representation" } });
      if(!res || !res.length) throw new Error("No se eliminó: tu usuario no es el administrador.");
      rows = rows.filter(p => p.id !== id); render(); say("Eliminado");
    }
  } catch(err){ say(err.message, 1); }
  btn.disabled = false;
});
$("list").addEventListener("change", async e => {
  if(!e.target.classList.contains("f-file")) return;
  const row = e.target.closest(".row"), f = e.target.files[0]; if(!f) return;
  try {
    const d = await resizeImage(f); pending[row.dataset.id] = d;
    row.querySelector(".thumb").innerHTML = '<img src="' + d + '" alt="">';
    say("Foto lista. Presiona “Guardar” para aplicarla.");
  } catch(err){ say("No se pudo leer esa imagen.", 1); }
});

$("addForm").addEventListener("submit", async e => {
  e.preventDefault(); const b = $("a-btn"); b.disabled = true;
  try {
    const cat = $("a-cat").value;
    const body = {
      categoria: cat, nombre: $("a-nombre").value.trim(), descripcion: $("a-desc").value.trim(),
      precio: Number($("a-precio").value), visible: true,
      orden: Math.max(0, ...rows.filter(p => p.categoria === cat).map(p => p.orden)) + 10,
    };
    const file = $("a-foto").files[0];
    if(file) body.imagen = await resizeImage(file);
    const res = await api("productos", { method:"POST", headers:{ Prefer:"return=representation" }, body: JSON.stringify(body) });
    rows.push(res[0]); render(); e.target.reset(); $("a-cat").value = cat;
    say("Producto agregado ✔");
  } catch(err){ say(/row-level security|42501/.test(err.message) ? "No se agregó: tu usuario no es el administrador." : err.message, 1); }
  b.disabled = false;
});

$("importBtn").onclick = async () => {
  if(!confirm("Se cargarán los productos iniciales. ¿Continuar?")) return;
  const b = $("importBtn"); b.disabled = true;
  try {
    const seed = await (await fetch("seed.json")).json();
    for(let i = 0; i < seed.length; i += 8){
      $("importMsg").textContent = "Importando " + Math.min(i + 8, seed.length) + " de " + seed.length + "…";
      await api("productos", { method:"POST", headers:{ Prefer:"return=minimal" }, body: JSON.stringify(seed.slice(i, i + 8)) });
    }
    $("importMsg").textContent = ""; await load(); say("Catálogo importado ✔");
  } catch(err){ say("Falló la importación: " + err.message, 1); await load().catch(() => {}); }
  b.disabled = false;
};

if(session) start(); else showLogin();
</script>
</body>
</html>
